# Monitoring Stack with Prometheus and Grafana for Heart Disease API
# AIML ZG523 - MLOps Assignment 1

services:
  heart-disease-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: heart_disease_api_monitored
    ports:
      - "8000:8000"
    networks:
      - mlops-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: heart_disease_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - mlops-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: heart_disease_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - mlops-net
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  mlops-net:
    driver: bridge
