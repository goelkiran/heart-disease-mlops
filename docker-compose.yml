# Local Single-Command Orchestration
# AIML ZG523 - MLOps Assignment 1

services:
  heart-disease-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heart_disease_serving_api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
